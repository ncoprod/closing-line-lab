name: Paper research
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-ledger
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: ready
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          enabled = bool(os.environ.get('ODDS_API_KEY')) and pathlib.Path('config/fitted_model.json').exists()
          enabled = enabled and bool(subprocess.check_output(['git', 'tag', '-l', 'forward-v1']).strip())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'enabled={str(enabled).lower()}\n')
          print('READY' if enabled else 'WAITING_FOR_KEY_OR_FROZEN_MODEL; no provider request')
          PY
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.ready.outputs.enabled == 'true'
        with:
          enable-cache: true
      - if: steps.ready.outputs.enabled == 'true'
        run: uv sync --frozen
      - if: steps.ready.outputs.enabled == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only origin main
          uv run cll forward
          uv run cll report
          uv run cll publish
          uv run cll score
          if [ -n "$(git status --porcelain -- data)" ]; then
            uv run cll report
            uv run cll publish --settlements-only
          fi
