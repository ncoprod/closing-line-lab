name: Paper research
on:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-ledger
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      enabled: ${{ steps.permission.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: permission
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open('config/data_permission.json'))
          enabled = all(p.get(k) for k in ['evidence', 'automated_collection', 'model_training', 'ledger_publication'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'enabled={str(enabled).lower()}\n')
          print('Permission gate: ' + ('enabled' if enabled else 'BLOCKED_DATA_PERMISSION; no data requested'))
          PY
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.permission.outputs.enabled == 'true'
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.permission.outputs.enabled == 'true'
        with:
          path: |
            data/raw
            data/processed
          key: research-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: research-data-${{ runner.os }}-
      - if: steps.permission.outputs.enabled == 'true'
        run: uv sync --frozen
      - if: steps.permission.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run cll forward
          uv run cll publish
  score:
    needs: forecast
    if: needs.forecast.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/processed
          key: research-data-${{ runner.os }}-${{ github.run_id }}-score
          restore-keys: research-data-${{ runner.os }}-
      - run: uv sync --frozen
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only origin main
          uv run cll score
          uv run cll report
          uv run cll publish --settlements-only
